[package]
name = "cascada"
version = "0.5.9"
edition = "2021"
description = "Copy trading desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5"
parking_lot = "0.12"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
directories = "5"

# Windows-only Job Object support: lets us bind mitmdump/Chrome to
# Cascada's process lifetime via JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE,
# so a brutal app termination (auto-updater, Task Manager, crash)
# can't leak children that lock files the next installer needs to
# overwrite (see _asyncio.pyd file-in-use error reports).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
