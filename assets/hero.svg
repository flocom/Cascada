<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Cascada — local copy-trading desktop">
  <defs>
    <!-- Backgrounds -->
    <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="100%" stop-color="#0E1A35"/>
    </linearGradient>

    <!-- Cascade flow ribbons -->
    <linearGradient id="flowA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- NEW ribbon -->
    <linearGradient id="newGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Platform tile gradient -->
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Layered background -->
  <rect width="1600" height="700" fill="url(#sky)"/>
  <rect width="1600" height="700" fill="url(#bgGlow)"/>
  <rect width="1600" height="700" fill="url(#bgGlow2)"/>

  <!-- Subtle grid texture -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.15">
    <path d="M0 140 H1600 M0 280 H1600 M0 420 H1600 M0 560 H1600"/>
    <path d="M200 0 V700 M400 0 V700 M600 0 V700 M800 0 V700 M1000 0 V700 M1200 0 V700 M1400 0 V700"/>
  </g>

  <!-- Cascade flow ribbons (the "waterfall" metaphor) -->
  <g filter="url(#softGlow)" opacity="0.85">
    <path d="M -50 200 Q 400 280, 800 220 T 1650 260" fill="none" stroke="url(#flowA)" stroke-width="3"/>
    <path d="M -50 280 Q 400 360, 800 300 T 1650 340" fill="none" stroke="url(#flowB)" stroke-width="2.5"/>
    <path d="M -50 360 Q 400 440, 800 380 T 1650 420" fill="none" stroke="url(#flowC)" stroke-width="2"/>
  </g>

  <!-- ────────────────────────  LEFT COLUMN  ──────────────────────── -->

  <!-- Logo mark -->
  <g transform="translate(110 110)">
    <rect width="120" height="120" rx="28" fill="#0B1533" stroke="#1E3A8A" stroke-width="1.5"/>
    <g transform="translate(20 30)">
      <rect x="0" y="0" width="80" height="14" rx="7" fill="#7DD3FC" opacity="0.7"/>
      <rect x="14" y="22" width="80" height="14" rx="7" fill="#7DD3FC" opacity="0.85"/>
      <rect x="28" y="44" width="80" height="14" rx="7" fill="#F8FAFC"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="260" y="174" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#titleGrad)">Cascada</text>
    <text x="262" y="220" font-size="24" font-weight="500" fill="#94A3B8">Local copy-trading for traders who don't want a black box.</text>
  </g>

  <!-- Headline pitch -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="110" y="320" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Mirror trades from any platform,</text>
    <text x="110" y="370" font-size="42" font-weight="700" letter-spacing="-1">
      <tspan fill="#F8FAFC">to any platform — </tspan><tspan fill="#7DD3FC">on your machine.</tspan>
    </text>
  </g>

  <!-- Platform tile row -->
  <g transform="translate(110 420)">
    <!-- cTrader -->
    <g transform="translate(0 0)" filter="url(#cardShadow)">
      <rect width="170" height="84" rx="14" fill="url(#tileBg)" stroke="#334155"/>
      <rect width="4" height="84" rx="2" fill="#0EA5E9"/>
      <text x="20" y="34" font-family="ui-sans-serif, -apple-system" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">PLATFORM</text>
      <text x="20" y="62" font-family="ui-sans-serif, -apple-system" font-size="20" font-weight="700" fill="#F8FAFC">cTrader</text>
    </g>
    <!-- MT4 -->
    <g transform="translate(186 0)" filter="url(#cardShadow)">
      <rect width="170" height="84" rx="14" fill="url(#tileBg)" stroke="#334155"/>
      <rect width="4" height="84" rx="2" fill="#0EA5E9"/>
      <text x="20" y="34" font-family="ui-sans-serif, -apple-system" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">PLATFORM</text>
      <text x="20" y="62" font-family="ui-sans-serif, -apple-system" font-size="20" font-weight="700" fill="#F8FAFC">MT4</text>
    </g>
    <!-- MT5 -->
    <g transform="translate(372 0)" filter="url(#cardShadow)">
      <rect width="170" height="84" rx="14" fill="url(#tileBg)" stroke="#334155"/>
      <rect width="4" height="84" rx="2" fill="#0EA5E9"/>
      <text x="20" y="34" font-family="ui-sans-serif, -apple-system" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">PLATFORM</text>
      <text x="20" y="62" font-family="ui-sans-serif, -apple-system" font-size="20" font-weight="700" fill="#F8FAFC">MT5</text>
    </g>
    <!-- TradingView with NEW badge -->
    <g transform="translate(558 0)" filter="url(#cardShadow)">
      <rect width="220" height="84" rx="14" fill="url(#tileBg)" stroke="#A855F7" stroke-opacity="0.6"/>
      <rect width="4" height="84" rx="2" fill="url(#newGrad)"/>
      <text x="20" y="34" font-family="ui-sans-serif, -apple-system" font-size="11" font-weight="600" fill="#A855F7" letter-spacing="2">NEW · v0.8</text>
      <text x="20" y="62" font-family="ui-sans-serif, -apple-system" font-size="20" font-weight="700" fill="#F8FAFC">TradingView</text>
      <g transform="translate(178 12)">
        <rect width="32" height="32" rx="16" fill="url(#newGrad)" opacity="0.18"/>
        <text x="16" y="22" text-anchor="middle" font-size="18">✨</text>
      </g>
    </g>
  </g>

  <!-- Trust badges (small chips) -->
  <g transform="translate(110 540)" font-family="ui-sans-serif, -apple-system" font-size="13" font-weight="600">
    <g>
      <rect width="148" height="34" rx="17" fill="#10B981" opacity="0.14" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="74" y="22" fill="#A7F3D0" text-anchor="middle">🔒  100% local</text>
    </g>
    <g transform="translate(160 0)">
      <rect width="170" height="34" rx="17" fill="#6366F1" opacity="0.16" stroke="#818CF8" stroke-opacity="0.5"/>
      <text x="85" y="22" fill="#C7D2FE" text-anchor="middle">🚫  No cloud, no login</text>
    </g>
    <g transform="translate(342 0)">
      <rect width="148" height="34" rx="17" fill="#F59E0B" opacity="0.14" stroke="#FBBF24" stroke-opacity="0.5"/>
      <text x="74" y="22" fill="#FDE68A" text-anchor="middle">⚡  Tauri + Rust</text>
    </g>
    <g transform="translate(502 0)">
      <rect width="160" height="34" rx="17" fill="#0EA5E9" opacity="0.14" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="80" y="22" fill="#BAE6FD" text-anchor="middle">📖  Open source</text>
    </g>
  </g>

  <!-- Bottom signature line -->
  <g font-family="ui-sans-serif, -apple-system" font-size="14" fill="#475569">
    <text x="110" y="640">Multi-feed quote compare · per-feed SL/TP drift · pending orders · auto-discovery for cBots and EAs.</text>
  </g>

  <!-- ────────────────────────  RIGHT: APP MOCKUP  ──────────────────────── -->

  <g transform="translate(900 80)" filter="url(#cardShadow)">
    <!-- Window chrome -->
    <rect width="600" height="540" rx="20" fill="#0F1B38" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="600" height="40" rx="20" fill="#0B1533"/>
    <rect y="20" width="600" height="20" fill="#0B1533"/>
    <g transform="translate(20 20)">
      <circle cx="0" cy="0" r="6" fill="#EF4444" opacity="0.85"/>
      <circle cx="20" cy="0" r="6" fill="#F59E0B" opacity="0.85"/>
      <circle cx="40" cy="0" r="6" fill="#10B981" opacity="0.85"/>
    </g>
    <text x="300" y="25" text-anchor="middle" font-family="ui-sans-serif, -apple-system" font-size="12" font-weight="600" fill="#64748B">Cascada · Dashboard</text>

    <!-- Sidebar -->
    <rect y="40" width="148" height="500" fill="#0B1533"/>
    <g font-family="ui-sans-serif, -apple-system" font-size="13">
      <g transform="translate(16 70)">
        <rect width="116" height="32" rx="8" fill="#1E3A8A" opacity="0.45"/>
        <text x="14" y="21" fill="#93C5FD" font-weight="600">📊  Dashboard</text>
      </g>
      <text x="30" y="124" fill="#94A3B8">👥  Accounts</text>
      <text x="30" y="156" fill="#94A3B8">⚙️  Copy rules</text>
      <text x="30" y="188" fill="#94A3B8">📜  Trades</text>
      <text x="30" y="220" fill="#94A3B8">⚖️  Compare</text>
      <text x="30" y="252" fill="#94A3B8">📋  Logs</text>
    </g>

    <!-- KPI tiles -->
    <g transform="translate(170 60)">
      <g>
        <rect width="200" height="80" rx="12" fill="#0B1533" stroke="#1E293B"/>
        <text x="16" y="28" font-family="ui-sans-serif, -apple-system" font-size="10" font-weight="600" fill="#64748B" letter-spacing="2">EQUITY</text>
        <text x="16" y="58" font-family="ui-sans-serif, -apple-system" font-size="24" font-weight="800" fill="#F8FAFC">€24 812.40</text>
        <text x="180" y="58" text-anchor="end" font-family="ui-sans-serif, -apple-system" font-size="13" font-weight="700" fill="#6EE7B7">+2.4%</text>
      </g>
      <g transform="translate(214 0)">
        <rect width="200" height="80" rx="12" fill="#0B1533" stroke="#1E293B"/>
        <text x="16" y="28" font-family="ui-sans-serif, -apple-system" font-size="10" font-weight="600" fill="#64748B" letter-spacing="2">ACCOUNTS</text>
        <text x="16" y="58" font-family="ui-sans-serif, -apple-system" font-size="24" font-weight="800" fill="#F8FAFC">4</text>
        <text x="180" y="58" text-anchor="end" font-family="ui-sans-serif, -apple-system" font-size="11" fill="#94A3B8">TV · cT · MT4 · MT5</text>
      </g>
    </g>

    <!-- Activity feed -->
    <g transform="translate(170 160)" font-family="ui-sans-serif, -apple-system">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#E2E8F0">Recent activity</text>
      <text x="414" y="0" font-size="11" font-weight="600" fill="#10B981" text-anchor="end">● live</text>

      <!-- Trade 1: TV → MT5 -->
      <g transform="translate(0 16)">
        <rect width="414" height="64" rx="10" fill="#0B1533" stroke="#1E293B"/>
        <rect x="0" y="0" width="3" height="64" rx="1.5" fill="#A855F7"/>
        <g transform="translate(16 14)">
          <rect width="40" height="20" rx="6" fill="#10B981" opacity="0.18"/>
          <text x="20" y="14" text-anchor="middle" font-size="11" font-weight="800" fill="#6EE7B7">BUY</text>
        </g>
        <text x="68" y="28" font-size="14" font-weight="700" fill="#F8FAFC">EURUSD</text>
        <text x="160" y="28" font-size="11" fill="#A855F7" font-weight="600">OANDA:</text>
        <text x="68" y="50" font-size="11" fill="#64748B">TradingView → MT5 IC · 0.50 lot · ticket #88421</text>
        <text x="398" y="28" text-anchor="end" font-size="14" font-weight="800" fill="#6EE7B7">+€21.40</text>
        <text x="398" y="50" text-anchor="end" font-size="10" fill="#64748B">12s ago</text>
      </g>

      <!-- Trade 2: cT → MT4 -->
      <g transform="translate(0 92)">
        <rect width="414" height="64" rx="10" fill="#0B1533" stroke="#1E293B"/>
        <rect x="0" y="0" width="3" height="64" rx="1.5" fill="#0EA5E9"/>
        <g transform="translate(16 14)">
          <rect width="40" height="20" rx="6" fill="#EF4444" opacity="0.18"/>
          <text x="20" y="14" text-anchor="middle" font-size="11" font-weight="800" fill="#FCA5A5">SELL</text>
        </g>
        <text x="68" y="28" font-size="14" font-weight="700" fill="#F8FAFC">XAUUSD</text>
        <text x="68" y="50" font-size="11" fill="#64748B">cTrader → MT4 Pepperstone · 0.10 lot</text>
        <text x="398" y="28" text-anchor="end" font-size="14" font-weight="800" fill="#FCA5A5">−€8.70</text>
        <text x="398" y="50" text-anchor="end" font-size="10" fill="#64748B">38s ago</text>
      </g>

      <!-- Trade 3: pending -->
      <g transform="translate(0 168)">
        <rect width="414" height="64" rx="10" fill="#0B1533" stroke="#1E293B"/>
        <rect x="0" y="0" width="3" height="64" rx="1.5" fill="#A855F7"/>
        <g transform="translate(16 14)">
          <rect width="48" height="20" rx="6" fill="#6366F1" opacity="0.22"/>
          <text x="24" y="14" text-anchor="middle" font-size="11" font-weight="800" fill="#C7D2FE">PEND</text>
        </g>
        <text x="76" y="28" font-size="14" font-weight="700" fill="#F8FAFC">USDJPY</text>
        <text x="76" y="50" font-size="11" fill="#64748B">limit · TradingView → cTrader · expiry GTC</text>
        <text x="398" y="28" text-anchor="end" font-size="14" font-weight="800" fill="#C7D2FE">@ 151.20</text>
        <text x="398" y="50" text-anchor="end" font-size="10" fill="#64748B">queued</text>
      </g>
    </g>

    <!-- Compare strip at bottom -->
    <g transform="translate(170 416)" font-family="ui-sans-serif, -apple-system">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#E2E8F0">Quote compare · EURUSD</text>
      <text x="414" y="0" font-size="10" fill="#94A3B8" text-anchor="end">OANDA vs IC Markets · per-feed offset −0.4 pip</text>
      <g transform="translate(0 12)">
        <rect width="414" height="78" rx="10" fill="#0B1533" stroke="#1E293B"/>
        <!-- Master -->
        <g transform="translate(16 14)">
          <text x="0" y="12" font-size="9" fill="#94A3B8" letter-spacing="1.5" font-weight="600">MASTER · TV / OANDA</text>
          <text x="0" y="40" font-size="22" font-weight="800" fill="#F8FAFC">1.08412</text>
          <text x="0" y="56" font-size="10" fill="#64748B">bid 1.08410  ·  ask 1.08414</text>
        </g>
        <!-- Delta arrow -->
        <g transform="translate(207 32)">
          <text x="0" y="0" text-anchor="middle" font-size="22" font-weight="800" fill="#FBBF24">▲</text>
          <text x="0" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#FBBF24">+0.4 pip</text>
        </g>
        <!-- Slave -->
        <g transform="translate(398 14)">
          <text x="0" y="12" font-size="9" fill="#94A3B8" letter-spacing="1.5" font-weight="600" text-anchor="end">SLAVE · IC MARKETS</text>
          <text x="0" y="40" font-size="22" font-weight="800" fill="#F8FAFC" text-anchor="end">1.08416</text>
          <text x="0" y="56" font-size="10" fill="#64748B" text-anchor="end">bid 1.08414  ·  ask 1.08418</text>
        </g>
      </g>
    </g>
  </g>
</svg>
