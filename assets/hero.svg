<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-label="Cascada — local copy-trading desktop for cTrader, MT4, MT5 and TradingView">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0E1A35"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="newRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#sky)"/>

  <!-- Ambient cascade waves -->
  <g opacity="0.55">
    <path d="M0 420 C 240 340, 480 500, 800 420 S 1360 340, 1600 420 L 1600 620 L 0 620 Z" fill="url(#wave)"/>
    <path d="M0 480 C 240 410, 480 550, 800 480 S 1360 410, 1600 480 L 1600 620 L 0 620 Z" fill="url(#wave)" opacity="0.6"/>
  </g>

  <!-- Logo -->
  <g transform="translate(110 120)" filter="url(#glow)">
    <rect width="180" height="180" rx="42" fill="url(#logoBg)"/>
    <rect x="24" y="51" width="92" height="17" rx="8" fill="url(#bar)" opacity="0.75"/>
    <rect x="42" y="82" width="92" height="17" rx="8" fill="url(#bar)" opacity="0.88"/>
    <rect x="60" y="113" width="92" height="17" rx="8" fill="url(#bar)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" fill="#F8FAFC">
    <text x="340" y="210" font-size="104" font-weight="700" letter-spacing="-3">Cascada</text>
    <text x="346" y="262" font-size="26" font-weight="500" fill="#94A3B8">Copy trading desktop, made local.</text>
  </g>

  <!-- Platform chips row 1 -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600">
    <g transform="translate(340 320)">
      <rect width="138" height="46" rx="23" fill="#0EA5E9" opacity="0.18" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="69" y="30" fill="#BAE6FD" text-anchor="middle">cTrader</text>
    </g>
    <g transform="translate(492 320)">
      <rect width="148" height="46" rx="23" fill="#0EA5E9" opacity="0.18" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="74" y="30" fill="#BAE6FD" text-anchor="middle">MetaTrader 4</text>
    </g>
    <g transform="translate(654 320)">
      <rect width="148" height="46" rx="23" fill="#0EA5E9" opacity="0.18" stroke="#38BDF8" stroke-opacity="0.6"/>
      <text x="74" y="30" fill="#BAE6FD" text-anchor="middle">MetaTrader 5</text>
    </g>
    <!-- TradingView with NEW badge -->
    <g transform="translate(816 320)">
      <rect width="170" height="46" rx="23" fill="#6366F1" opacity="0.22" stroke="#818CF8" stroke-opacity="0.8"/>
      <text x="85" y="30" fill="#E0E7FF" text-anchor="middle">TradingView</text>
      <g transform="translate(140 -10)">
        <rect width="46" height="22" rx="11" fill="url(#newRibbon)"/>
        <text x="23" y="16" fill="#FFFFFF" text-anchor="middle" font-size="12" font-weight="700">NEW</text>
      </g>
    </g>

    <!-- Row 2: trust chips -->
    <g transform="translate(340 384)">
      <rect width="178" height="46" rx="23" fill="#10B981" opacity="0.16" stroke="#34D399" stroke-opacity="0.6"/>
      <text x="89" y="30" fill="#A7F3D0" text-anchor="middle">Local &amp; private</text>
    </g>
    <g transform="translate(532 384)">
      <rect width="206" height="46" rx="23" fill="#6366F1" opacity="0.18" stroke="#818CF8" stroke-opacity="0.6"/>
      <text x="103" y="30" fill="#C7D2FE" text-anchor="middle">No cloud, no account</text>
    </g>
    <g transform="translate(752 384)">
      <rect width="170" height="46" rx="23" fill="#F59E0B" opacity="0.18" stroke="#FBBF24" stroke-opacity="0.6"/>
      <text x="85" y="30" fill="#FDE68A" text-anchor="middle">Tauri 2 + Rust</text>
    </g>
  </g>

  <!-- Tagline strip -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="340" y="478" fill="#64748B" font-size="16">Mirror trades from any combination of cTrader · MT4 · MT5 · TradingView PaperTrading.</text>
    <text x="340" y="502" fill="#64748B" font-size="16">Live quote compare across brokers with multi-feed support · per-feed SL/TP drift compensation.</text>
  </g>

  <!-- Mini live mockup panel on the right -->
  <g transform="translate(1020 100)">
    <rect width="480" height="420" rx="18" fill="#0F1B38" stroke="#1E293B"/>
    <!-- sidebar -->
    <rect width="130" height="420" rx="18" fill="#111E3F"/>
    <g fill="#64748B" font-family="ui-sans-serif, -apple-system" font-size="12">
      <circle cx="22" cy="32" r="7" fill="url(#logoBg)"/>
      <text x="40" y="36" fill="#E2E8F0" font-weight="700">Cascada</text>
      <rect x="14" y="66" width="100" height="26" rx="6" fill="#1E3A8A" opacity="0.5"/>
      <text x="26" y="84" fill="#93C5FD">Dashboard</text>
      <text x="26" y="114" fill="#94A3B8">Accounts</text>
      <text x="26" y="142" fill="#94A3B8">Copy rules</text>
      <text x="26" y="170" fill="#94A3B8">Trades</text>
      <text x="26" y="198" fill="#94A3B8">Compare</text>
      <text x="26" y="226" fill="#94A3B8">Logs</text>
    </g>
    <!-- content: 2 KPI tiles -->
    <g transform="translate(150 24)">
      <g>
        <rect width="148" height="70" rx="10" fill="#0B1533" stroke="#1E293B"/>
        <text x="14" y="26" fill="#64748B" font-size="11" font-family="ui-sans-serif, -apple-system">TOTAL EQUITY</text>
        <text x="14" y="54" fill="#F8FAFC" font-size="22" font-weight="700" font-family="ui-sans-serif, -apple-system">24 812.40</text>
      </g>
      <g transform="translate(160 0)">
        <rect width="148" height="70" rx="10" fill="#0B1533" stroke="#1E293B"/>
        <text x="14" y="26" fill="#64748B" font-size="11" font-family="ui-sans-serif, -apple-system">ACCOUNTS</text>
        <text x="14" y="54" fill="#F8FAFC" font-size="22" font-weight="700" font-family="ui-sans-serif, -apple-system">4 / 4</text>
      </g>
    </g>
    <!-- mini trades row -->
    <g transform="translate(150 118)" font-family="ui-sans-serif, -apple-system" font-size="11">
      <text x="0" y="0" fill="#E2E8F0" font-weight="600" font-size="13">Recent activity</text>
      <g transform="translate(0 18)">
        <rect width="308" height="56" rx="8" fill="#0B1533" stroke="#1E293B"/>
        <rect x="10" y="10" width="34" height="16" rx="4" fill="#10B981" opacity="0.2"/>
        <text x="27" y="22" fill="#6EE7B7" text-anchor="middle" font-size="10" font-weight="700">BUY</text>
        <text x="54" y="22" fill="#E2E8F0" font-weight="600">EURUSD</text>
        <text x="54" y="42" fill="#64748B">TV → MT5 · 0.50 lot</text>
        <text x="298" y="42" fill="#6EE7B7" text-anchor="end" font-weight="700">+21.40</text>
      </g>
      <g transform="translate(0 84)">
        <rect width="308" height="56" rx="8" fill="#0B1533" stroke="#1E293B"/>
        <rect x="10" y="10" width="34" height="16" rx="4" fill="#EF4444" opacity="0.2"/>
        <text x="27" y="22" fill="#FCA5A5" text-anchor="middle" font-size="10" font-weight="700">SELL</text>
        <text x="54" y="22" fill="#E2E8F0" font-weight="600">XAUUSD</text>
        <text x="54" y="42" fill="#64748B">cTrader → MT4 · 0.10 lot</text>
        <text x="298" y="42" fill="#FCA5A5" text-anchor="end" font-weight="700">−8.70</text>
      </g>
      <g transform="translate(0 150)">
        <rect width="308" height="56" rx="8" fill="#0B1533" stroke="#1E293B"/>
        <rect x="10" y="10" width="40" height="16" rx="4" fill="#6366F1" opacity="0.25"/>
        <text x="30" y="22" fill="#C7D2FE" text-anchor="middle" font-size="10" font-weight="700">PEND</text>
        <text x="60" y="22" fill="#E2E8F0" font-weight="600">USDJPY</text>
        <text x="60" y="42" fill="#64748B">limit · TV → cTrader</text>
        <text x="298" y="42" fill="#C7D2FE" text-anchor="end" font-weight="700">@ 151.20</text>
      </g>
      <!-- Mini compare strip -->
      <g transform="translate(0 220)">
        <text x="0" y="0" fill="#E2E8F0" font-weight="600" font-size="13">Quote compare</text>
        <text x="298" y="0" fill="#94A3B8" text-anchor="end" font-size="10">EURUSD · OANDA vs ICMARKETS</text>
        <g transform="translate(0 12)">
          <rect width="308" height="40" rx="8" fill="#0B1533" stroke="#1E293B"/>
          <text x="14" y="17" fill="#94A3B8" font-size="10">MASTER (TV · OANDA)</text>
          <text x="14" y="32" fill="#E2E8F0" font-weight="700" font-size="13">1.08412</text>
          <text x="160" y="25" fill="#FBBF24" font-weight="700" font-size="13" text-anchor="middle">▲ +0.4 pip</text>
          <text x="294" y="17" fill="#94A3B8" font-size="10" text-anchor="end">SLAVE (IC)</text>
          <text x="294" y="32" fill="#E2E8F0" font-weight="700" font-size="13" text-anchor="end">1.08416</text>
        </g>
      </g>
    </g>
  </g>
</svg>
